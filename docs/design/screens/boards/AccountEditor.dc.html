<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit account</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(245,181,68,0.16)}
.ico{width:44px;height:44px;margin:3px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(245,181,68,0.16)}
.ico.on{outline:2px solid var(--accent-fill);outline-offset:3px}
.sw{width:32px;height:32px;margin:6px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#0B0D10}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--money-expense:#FF7A66;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Accounts</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Edit account" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div class="handle"></div>
<div style="display: flex; align-items: center; gap: 12px"><span class="tile"><span class="ms" aria-hidden="true" style="color: #F5B544">payments</span></span><h2 style="margin: 0; flex: 1 1 0; font-size: 18px; line-height: 24px; font-weight: 700">Edit account</h2><button style="padding: 12px; font-size: 13px; font-weight: 600; color: var(--money-expense)">Remove</button></div>
<label style="height: 52px; border-radius: 18px; background: var(--bg-surface-raised); display: flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 500">Salary</label>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="over">Type</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button class="chip on">Debit card</button><button class="chip">Credit card</button><button class="chip">Cash</button><button class="chip">Savings</button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="over">Card's last 4 digits</span><label style="height: 52px; border-radius: 18px; background: var(--bg-surface-raised); display: flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 500">1234</label><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-muted)">Bank notifications from this card go to this account.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="over">Icon</span><div style="display: flex; gap: 14px"><button class="ico" aria-label="Card"><span class="ms" aria-hidden="true" style="color: #F5B544">credit_card</span></button><button class="ico on" aria-label="Payments"><span class="ms" aria-hidden="true" style="color: #F5B544">payments</span></button><button class="ico" aria-label="Wallet"><span class="ms" aria-hidden="true" style="color: #F5B544">account_balance_wallet</span></button><button class="ico" aria-label="Bank"><span class="ms" aria-hidden="true" style="color: #F5B544">account_balance</span></button><button class="ico" aria-label="Savings"><span class="ms" aria-hidden="true" style="color: #F5B544">savings</span></button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="over">Colour</span><div style="display: flex; flex-wrap: wrap"><button class="sw" aria-label="Teal" style="background: #5DCAA5"></button><button class="sw" aria-label="Coral" style="background: #FF7A66"></button><button class="sw" aria-label="Blue" style="background: #8AB4F8"></button><button class="sw" aria-label="Violet" style="background: #B39DFF"></button><button class="sw" aria-label="Amber, selected" style="background: #F5B544"><span class="ms" aria-hidden="true" style="font-size: 20px">check</span></button><button class="sw" aria-label="Yellow" style="background: #FFD166"></button><button class="sw" aria-label="Orange" style="background: #FF9F6E"></button><button class="sw" aria-label="Sky" style="background: #7FD1F7"></button></div></div>
<button style="height: 56px; border-radius: 999px; background: var(--accent-fill); color: var(--accent-on); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
