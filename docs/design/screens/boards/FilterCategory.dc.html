<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter sheet — category</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:18px;font-size:15px;font-weight:600;width:100%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:11px;line-height:14px;font-weight:500;color:var(--text-muted);text-align:center}
.t48{width:48px;height:48px;margin:3px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.cell.on{color:var(--text-primary)}
.cell.on .t48{outline:2px solid var(--accent-fill);outline-offset:3px}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-muted:#8A94A3;--accent-fill:#C8F169;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">History</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Category" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 6px">
<div class="handle"></div>
<h2 style="margin: 12px 0 2px; font-size: 18px; line-height: 24px; font-weight: 700">Category</h2>
<button class="opt">All categories</button>
<span class="over" style="padding: 6px 4px 0">Expense</span>
<div class="grid">
<button class="cell"><span class="t48" style="background: rgba(93,202,165,0.16)"><span class="ms" aria-hidden="true" style="color: #5DCAA5">shopping_cart</span></span>Groceries</button>
<button class="cell"><span class="t48" style="background: rgba(255,159,110,0.16)"><span class="ms" aria-hidden="true" style="color: #FF9F6E">restaurant</span></span>Cafe</button>
<button class="cell"><span class="t48" style="background: rgba(245,181,68,0.16)"><span class="ms" aria-hidden="true" style="color: #F5B544">work</span></span>Work</button>
<button class="cell"><span class="t48" style="background: rgba(255,209,102,0.16)"><span class="ms" aria-hidden="true" style="color: #FFD166">local_taxi</span></span>Transport</button>
<button class="cell on"><span class="t48" style="background: rgba(138,180,248,0.16)"><span class="ms" aria-hidden="true" style="color: #8AB4F8">directions_car</span></span>Car</button>
<button class="cell"><span class="t48" style="background: rgba(255,122,102,0.16)"><span class="ms" aria-hidden="true" style="color: #FF7A66">medical_services</span></span>Health</button>
<button class="cell"><span class="t48" style="background: rgba(244,154,194,0.16)"><span class="ms" aria-hidden="true" style="color: #F49AC2">content_cut</span></span>Grooming</button>
<button class="cell"><span class="t48" style="background: rgba(154,208,168,0.16)"><span class="ms" aria-hidden="true" style="color: #9AD0A8">bolt</span></span>Utilities</button>
<button class="cell"><span class="t48" style="background: rgba(179,157,255,0.16)"><span class="ms" aria-hidden="true" style="color: #B39DFF">subscriptions</span></span>Subscriptions</button>
<button class="cell"><span class="t48" style="background: rgba(255,181,71,0.16)"><span class="ms" aria-hidden="true" style="color: #FFB547">school</span></span>Kids &amp; Education</button>
<button class="cell"><span class="t48" style="background: rgba(127,209,247,0.16)"><span class="ms" aria-hidden="true" style="color: #7FD1F7">shopping_bag</span></span>Shopping</button>
<button class="cell"><span class="t48" style="background: rgba(199,155,242,0.16)"><span class="ms" aria-hidden="true" style="color: #C79BF2">sports_esports</span></span>Entertainment</button>
</div>
<span class="over" style="padding: 6px 4px 0">Income</span>
<div class="grid">
<button class="cell"><span class="t48" style="background: rgba(74,222,155,0.16)"><span class="ms" aria-hidden="true" style="color: #4ADE9B">payments</span></span>Paycheck</button>
<button class="cell"><span class="t48" style="background: rgba(74,222,155,0.16)"><span class="ms" aria-hidden="true" style="color: #4ADE9B">savings</span></span>Cashback &amp; Interest</button>
<button class="cell"><span class="t48" style="background: rgba(247,160,114,0.16)"><span class="ms" aria-hidden="true" style="color: #F7A072">card_giftcard</span></span>Gift</button>
<button class="cell"><span class="t48" style="background: rgba(138,148,163,0.16)"><span class="ms" aria-hidden="true" style="color: #8A94A3">more_horiz</span></span>Other income</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
