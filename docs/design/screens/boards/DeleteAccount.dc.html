<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.fill{font-variation-settings:'FILL' 1}
.num{font-family:'Space Grotesk',Manrope,sans-serif;font-weight:500}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.muted{color:var(--text-muted)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.gt{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}

.row{background:var(--bg-surface);border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--bg-surface-high);position:relative;flex:none}
.toggle>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text-muted)}
.toggle.on{background:var(--accent-fill)}
.toggle.on>i{left:21px;background:var(--accent-on)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0;flex:none}
.field{height:52px;padding:0 16px;display:flex;align-items:center;border-radius:16px;background:var(--bg-surface-raised);font-size:15px;font-weight:500}
.field.ph{color:var(--text-muted)}
.group{display:flex;flex-direction:column;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.segf{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.segf>span{flex:1 1 0;text-align:center;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.segf>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.opt{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.save{height:56px;border-radius:999px;background:var(--accent-fill);color:var(--accent-on);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.line{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border-default)}
.av{width:40px;height:40px;border-radius:20px;background:var(--bg-surface-high);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-surface);border-radius:28px 28px 0 0;padding:0 16px 20px;display:flex;flex-direction:column;gap:14px}
.dialog{position:absolute;left:32px;right:32px;background:var(--bg-surface-raised);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog h2{margin:0;font-size:22px;line-height:28px;font-weight:700}
.dialog p{margin:0;font-size:14px;line-height:20px;color:var(--text-secondary)}
.acts{display:flex;justify-content:flex-end;gap:24px;font-size:14px;font-weight:600;color:var(--accent-text)}
.bar{height:6px;border-radius:3px;background:var(--bg-surface-high);overflow:hidden}
.bar>i{display:block;height:6px;border-radius:3px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:17px;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.hd h1{margin:0;flex:1 1 0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-0.5px}
.fab{position:absolute;right:16px;bottom:24px;display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 22px;border-radius:20px;background:var(--accent-fill);color:var(--accent-on);font-size:15px;font-weight:600}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#C8F169;--money-expense:#FF7A66;--money-income:#4ADE9B;--status-warning:#F5B544;--person-me:#5B9DFF;--person-wife:#FF7AB6;--person-daughter:#FFB547;--person-mom:#A78BFA;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>

</div>
<div style="display: flex; justify-content: space-between; padding: 0 4px"><span class="over">Sat 2 Mar</span></div>
<div class="row"><div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span class="tile" style="background: rgba(255,159,110,0.16)"><span class="ms" aria-hidden="true" style="color: #FF9F6E">restaurant</span></span><div class="col"><span style="font-size: 15px; font-weight: 600">Coffee Moffie</span><span class="cap ell">Cafe · Coffee shop · Old card</span></div><span class="num" style="font-size: 17px">−₼26.90</span></div></div>

<button style="min-height: 48px; text-align: center; font-size: 14px; font-weight: 600; color: var(--money-expense)">Delete account and 3 transactions</button>
</div>
