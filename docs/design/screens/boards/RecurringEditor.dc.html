<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit recurring payment</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.field{height:52px;padding:0 16px;display:flex;align-items:center;border-radius:16px;background:var(--bg-surface-raised);font-size:15px;font-weight:500}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.seg>span{flex:1 1 0;text-align:center;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.group{display:flex;flex-direction:column;gap:8px}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--money-expense:#FF7A66;--person-me:#5B9DFF;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Recurring payments</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section aria-label="Edit payment" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-surface); border-radius: 28px 28px 0 0; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 10px auto 0"></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(179,157,255,0.16); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="color: #B39DFF">subscriptions</span></span><h2 style="margin: 0; flex: 1 1 0; font-size: 18px; line-height: 24px; font-weight: 700">Edit payment</h2><button style="font-size: 13px; font-weight: 600; color: var(--money-expense)">Remove</button></div>
<div class="field">Spotify</div>
<div class="field">16.31</div>
<div class="group"><span class="over">Category</span><div style="display: flex; gap: 8px; overflow: hidden"><span class="chip on">Subscriptions</span><span class="chip">Groceries</span><span class="chip">Cafe &amp; Restaurants</span></div></div>
<div class="group"><span class="over">For whom</span><div style="display: flex; gap: 8px"><span class="chip on"><i class="dot" style="background: var(--person-me)"></i>Me</span><span class="chip"><i class="dot" style="background: var(--person-family)"></i>Family</span></div></div>
<div class="group"><span class="over">From</span><div style="display: flex; gap: 8px"><span class="chip on">Card</span><span class="chip">Cash</span></div></div>
<div class="group"><span class="over">Repeats</span><div class="seg"><span>Weekly</span><span class="on">Monthly</span><span>Yearly</span></div></div>
<div class="group"><span class="over">Next payment</span><div><span class="chip"><span class="ms" aria-hidden="true" style="font-size: 18px; color: var(--text-secondary)">calendar_month</span>Tue 1 Dec</span></div></div>
<button style="height: 56px; border-radius: 999px; background: var(--accent-fill); color: var(--accent-on); text-align: center; font-size: 16px; font-weight: 600">Save</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
