<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archived and restore</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.row{background:var(--bg-surface);border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.seg>span{flex:1 1 0;text-align:center;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.arch{display:flex;align-items:center;padding-left:16px;padding-right:4px}
.arch>span{flex:1 1 0;font-size:15px;font-weight:500;color:var(--text-secondary)}
.arch>button{height:44px;padding:0 12px;font-size:13px;font-weight:600;color:var(--accent-text)}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#C8F169;--person-me:#5B9DFF;--person-family:#8A94A3}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<header style="flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px"><button class="iconbtn" aria-label="Back"><span class="ms" aria-hidden="true" style="color: var(--text-primary)">arrow_back</span></button><h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Categories</h1></header>
<div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
<div class="seg" style="margin-bottom: 4px"><span class="on">Expense</span><span>Income</span><span>People</span></div>
<div class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px"><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">drag_indicator</span><span class="tile" style="background: rgba(247,160,114,0.16)"><span class="ms" aria-hidden="true" style="color: #F7A072">redeem</span></span><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Gifts &amp; Occasions</span><span class="cap">2 sub-categories</span></div><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">expand_more</span></div>
<div class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px"><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">drag_indicator</span><span class="tile" style="background: rgba(111,199,217,0.16)"><span class="ms" aria-hidden="true" style="color: #6FC7D9">flight</span></span><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Travel</span><span class="cap">5 sub-categories</span></div><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">expand_more</span></div>
<div class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px"><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">drag_indicator</span><span class="tile" style="background: rgba(138,148,163,0.16)"><span class="ms" aria-hidden="true" style="color: #8A94A3">more_horiz</span></span><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Other</span></div><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-muted)">expand_more</span></div>
<span class="over" style="padding: 16px 4px 0">Archived</span>
<div class="row arch"><span>Pets</span><button>Restore</button></div>
<div class="row arch"><span>Coffee shop</span><button>Restore</button></div>
</div>
<div style="position: absolute; right: 16px; bottom: 24px"><button class="chip on" style="height: 56px; padding: 0 22px 0 18px; font-size: 15px; border-radius: 20px"><span class="ms" aria-hidden="true" style="color: var(--accent-on)">add</span>New category</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
