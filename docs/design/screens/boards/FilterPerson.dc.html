<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter sheet — person or account</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:18px;font-size:15px;font-weight:600;width:100%}
.opt.on{background:var(--bg-surface-high)}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-high:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--accent-text:#C8F169;--person-me:#5B9DFF;--person-wife:#FF7AB6;--person-daughter:#FFB547;--person-mom:#A78BFA;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">History</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Person" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 8px">
<div class="handle"></div>
<h2 style="margin: 14px 0 4px; font-size: 18px; line-height: 24px; font-weight: 700">Person</h2>
<button class="opt on"><span style="flex: 1 1 0">Everyone</span><span class="ms" aria-hidden="true" style="color: var(--accent-text)">check</span></button>
<button class="opt"><span class="dot" style="background: var(--person-me)"></span>Me</button>
<button class="opt"><span class="dot" style="background: var(--person-wife)"></span>Wife</button>
<button class="opt"><span class="dot" style="background: var(--person-daughter)"></span>Daughter</button>
<button class="opt"><span class="dot" style="background: var(--person-mom)"></span>Mom</button>
<button class="opt"><span class="dot" style="background: var(--person-family)"></span>Family</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
