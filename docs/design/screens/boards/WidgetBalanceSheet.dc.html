<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget balance sheet</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:18px;width:100%}
.opt.on{background:var(--bg-surface-high)}
.opt>span:first-child{flex:1 1 0;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:20px;font-weight:600}
.opt small{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-high:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--accent-text:#C8F169;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Settings</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Widget balance" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 8px">
<div class="handle"></div>
<h2 style="margin: 14px 0 4px; font-size: 18px; line-height: 24px; font-weight: 700">Widget balance</h2>
<button class="opt"><span>Always show<small>Balance is always visible.</small></span></button>
<button class="opt"><span>Always hide<small>Never shown on the home screen.</small></span></button>
<button class="opt"><span>Tap to show · 5 s<small>Tap to show, then it hides again.</small></span></button>
<button class="opt on"><span>Fingerprint to show<small>Touch opens a small fingerprint prompt.</small></span><span class="ms" aria-hidden="true" style="color: var(--accent-text)">check</span></button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
