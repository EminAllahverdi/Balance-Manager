<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pay back one debt</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Space+Grotesk:wght@500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.fill{font-variation-settings:'FILL' 1}
.num{font-family:'Space Grotesk',Manrope,sans-serif;font-weight:500}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.muted{color:var(--text-muted)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.row{background:var(--bg-surface);border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.seg>span{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--bg-surface-high);position:relative;flex:none}
.toggle>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text-muted)}
.toggle.on{background:var(--accent-fill)}
.toggle.on>i{left:21px;background:var(--accent-on)}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.scroll-x{display:flex;gap:8px;overflow:hidden}
.field{height:52px;padding:0 16px;display:flex;align-items:center;border-radius:16px;background:var(--bg-surface-raised);font-size:15px;font-weight:500}
.field.ph{color:var(--text-muted)}
.group{display:flex;flex-direction:column;gap:8px}
.segf{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.segf>span{flex:1 1 0;text-align:center;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.segf>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.opt{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.save{height:56px;border-radius:999px;background:var(--accent-fill);color:var(--accent-on);text-align:center;font-size:16px;font-weight:600}
.save.off{background:var(--bg-surface-high);color:var(--text-muted)}
.line{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border-default)}
.av{width:40px;height:40px;border-radius:20px;background:var(--bg-surface-high);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.hist{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hist+.hist{border-top:1px solid var(--border-default)}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#C8F169;--money-expense:#FF7A66;--money-income:#4ADE9B;--status-warning:#F5B544;--person-me:#5B9DFF;--person-wife:#FF7AB6;--person-daughter:#FFB547;--person-mom:#A78BFA;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}.t-light{--bg-canvas:#F7F8F5;--bg-surface:#FFFFFF;--bg-surface-raised:#F1F2EE;--bg-surface-high:#E3E6E1;--border-default:#E3E6E1;--border-strong:#AEB6C1;--text-primary:#0B0D10;--text-secondary:#5C6570;--text-muted:#5C6570;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#4A7A00;--money-expense:#C2412D;--money-income:#11845B;--status-warning:#A86A00;--person-me:#2F6FD6;--person-wife:#C93D82;--person-daughter:#B87700;--person-mom:#7357D6;--person-family:#5F6873;--scrim:rgba(11,13,16,0.45)}</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<header style="flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px"><button class="iconbtn" aria-label="Back"><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-primary)">arrow_back</span></button><h1 style="margin: 0; flex: 1 1 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Loans &amp; debts</h1></header>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section aria-label="Pay back" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-surface); border-radius: 28px 28px 0 0; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px"><div class="handle"></div>
<div style="display: flex; align-items: center; gap: 12px"><span class="tile" style="background: rgba(138,148,163,0.16)"><span class="ms" aria-hidden="true" style="color: #8A94A3">handshake</span></span><h2 style="margin: 0; flex: 1 1 0; font-size: 18px; line-height: 24px; font-weight: 700">Pay back Sam</h2><button style="font-size: 13px; font-weight: 600; color: var(--money-expense)">Remove</button></div>
<div class="field">10.00</div>
<span class="cap">₼10.00 as an expense in Work · Lunch</span>
<div class="group"><span class="over">From</span><div style="display: flex; gap: 8px"><span class="chip on"><i class="dot" style="background: #5DCAA5"></i>Card</span><span class="chip"><i class="dot" style="background: #F5B544"></i>Cash</span></div></div>
<div class="group"><span class="over">Date</span><div><span class="chip"><span class="ms" aria-hidden="true" style="font-size: 18px; color: var(--text-secondary)">calendar_month</span>Today</span></div></div>
<button class="save">Pay ₼10.00</button></section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
