<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colours in two rows</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(93,202,165,0.16)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sw{height:46px;display:flex;align-items:center;justify-content:center}
.dot{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#0B0D10}
.own{width:32px;height:32px;border-radius:16px;padding:3px;background:conic-gradient(from 90deg,#ff6b6b,#ffb547,#ffe066,#7be495,#6fc7d9,#8ab4f8,#b39dff,#f49ac2,#ff6b6b)}
.own span{width:26px;height:26px;border-radius:13px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--money-expense:#FF7A66;--scrim:rgba(0,0,0,0.62)}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<h1 style="margin: 0; padding: 16px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Categories</h1>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Edit category" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div class="handle"></div>
<div style="display: flex; align-items: center; gap: 12px"><span class="tile"><span class="ms" aria-hidden="true" style="color: #5DCAA5">shopping_cart</span></span><h2 style="margin: 0; flex: 1 1 0; font-size: 18px; line-height: 24px; font-weight: 700">Edit category</h2><button style="padding: 12px; font-size: 13px; font-weight: 600; color: var(--money-expense)">Remove</button></div>
<label style="height: 52px; border-radius: 18px; background: var(--bg-surface-raised); display: flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 500">Groceries</label>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="over">Colour</span>
<div class="grid">
<button class="sw" aria-label="Coral"><span class="dot" style="background: #FF7A66"></span></button>
<button class="sw" aria-label="Orange"><span class="dot" style="background: #FF9F6E"></span></button>
<button class="sw" aria-label="Amber"><span class="dot" style="background: #F5B544"></span></button>
<button class="sw" aria-label="Yellow"><span class="dot" style="background: #FFD166"></span></button>
<button class="sw" aria-label="Sage"><span class="dot" style="background: #9AD0A8"></span></button>
<button class="sw" aria-label="Green"><span class="dot" style="background: #4ADE9B"></span></button>
<button class="sw" aria-label="Teal, selected"><span class="dot" style="background: #5DCAA5"><span class="ms" aria-hidden="true" style="font-size: 20px">check</span></span></button>
<button class="sw" aria-label="Cyan"><span class="dot" style="background: #6FC7D9"></span></button>
<button class="sw" aria-label="Blue"><span class="dot" style="background: #8AB4F8"></span></button>
<button class="sw" aria-label="Violet"><span class="dot" style="background: #B39DFF"></span></button>
<button class="sw" aria-label="Lilac"><span class="dot" style="background: #C79BF2"></span></button>
<button class="sw" aria-label="Pink"><span class="dot" style="background: #F49AC2"></span></button>
<button class="sw" aria-label="Grey"><span class="dot" style="background: #8A94A3"></span></button>
<button class="sw" aria-label="Pick any colour"><span class="own"><span><span class="ms" aria-hidden="true" style="font-size: 16px">add</span></span></span></button>
</div>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-muted)">A colour of your own takes the last place, ticked, inside the ring.</span>
</div>
<button style="height: 56px; border-radius: 999px; background: var(--accent-fill); color: var(--accent-on); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
