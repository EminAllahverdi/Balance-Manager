<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recurring payments</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Space+Grotesk:wght@500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.num{font-family:'Space Grotesk',Manrope,sans-serif;font-weight:500;white-space:nowrap}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--bg-surface);border-radius:18px}
.pay{display:flex;align-items:center;gap:12px;padding:12px 14px}
.pay>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.pay b{font-size:15px;line-height:20px;font-weight:600}
.pay+.pay{border-top:1px solid var(--border-default)}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--border-default:#1F242B;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px; padding: 16px; gap: 12px">
<header style="display: flex; align-items: center; gap: 12px"><button class="iconbtn" aria-label="Back"><span class="ms" aria-hidden="true" style="color: var(--text-secondary)">arrow_back</span></button><h1 style="margin: 0; flex: 1 1 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">Recurring payments</h1><button class="iconbtn" aria-label="New payment"><span class="ms" aria-hidden="true" style="color: var(--text-secondary)">add</span></button></header>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px"><span class="over">About a month · 4 payments</span><span class="num" style="font-size: 28px; line-height: 32px; letter-spacing: -0.8px">₼126.31</span></div>
<span class="over" style="padding: 8px 4px 0">Due</span>
<div class="card" style="border: 1px solid var(--border-default)">
<div class="pay"><span class="tile" style="background: rgba(179,157,255,0.16)"><span class="ms" aria-hidden="true" style="color: #B39DFF">subscriptions</span></span><div><b>Spotify</b><span class="cap">Monthly · Today · Card</span></div><span class="num" style="font-size: 17px; line-height: 22px">₼16.31</span></div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 12px"><button class="chip">Skip</button><button class="chip on">Add</button></div>
</div>
<span class="over" style="padding: 8px 4px 0">Upcoming</span>
<div class="card">
<div class="pay"><span class="tile" style="background: rgba(179,157,255,0.16)"><span class="ms" aria-hidden="true" style="color: #B39DFF">subscriptions</span></span><div><b>Adobe</b><span class="cap">Monthly · Sat 7 Nov · Card</span></div><span class="num" style="font-size: 17px; line-height: 22px">₼40.00</span></div>
<div class="pay"><span class="tile" style="background: rgba(154,208,168,0.16)"><span class="ms" aria-hidden="true" style="color: #9AD0A8">bolt</span></span><div><b>Internet</b><span class="cap">Monthly · Sat 14 Nov · Card</span></div><span class="num" style="font-size: 17px; line-height: 22px">₼30.00</span></div>
<div class="pay"><span class="tile" style="background: rgba(127,209,247,0.16)"><span class="ms" aria-hidden="true" style="color: #7FD1F7">smartphone</span></span><div><b>Phone plan</b><span class="cap">Monthly · Tue 1 Dec · Cash</span></div><span class="num" style="font-size: 17px; line-height: 22px">₼40.00</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
