<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home chart</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Space+Grotesk:wght@500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.fill{font-variation-settings:'FILL' 1}
.num{font-family:'Space Grotesk',Manrope,sans-serif;font-weight:500}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.muted{color:var(--text-muted)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.row{background:var(--bg-surface);border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.seg>span{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--bg-surface-high);position:relative;flex:none}
.toggle>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text-muted)}
.toggle.on{background:var(--accent-fill)}
.toggle.on>i{left:21px;background:var(--accent-on)}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.scroll-x{display:flex;gap:8px;overflow:hidden}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#C8F169;--money-expense:#FF7A66;--money-income:#4ADE9B;--status-warning:#F5B544;--person-me:#5B9DFF;--person-wife:#FF7AB6;--person-daughter:#FFB547;--person-mom:#A78BFA;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}.t-light{--bg-canvas:#F7F8F5;--bg-surface:#FFFFFF;--bg-surface-raised:#F1F2EE;--bg-surface-high:#E3E6E1;--border-default:#E3E6E1;--border-strong:#AEB6C1;--text-primary:#0B0D10;--text-secondary:#5C6570;--text-muted:#5C6570;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#4A7A00;--money-expense:#C2412D;--money-income:#11845B;--status-warning:#A86A00;--person-me:#2F6FD6;--person-wife:#C93D82;--person-daughter:#B87700;--person-mom:#7357D6;--person-family:#5F6873;--scrim:rgba(11,13,16,0.45)}</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">
<div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; align-items: center; justify-content: space-between; padding-top: 16px">
<button style="display: flex; align-items: center; gap: 4px"><span style="font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.5px">October</span><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-secondary)">expand_more</span></button>
<div style="display: flex; gap: 8px"><button class="iconbtn" aria-label="Hide amounts"><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-secondary)">visibility</span></button><button class="iconbtn" aria-label="Settings"><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-secondary)">settings</span></button></div>
</header>
<section class="row" style="position: relative; padding: 20px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border-default); border-radius: 28px">
<button class="iconbtn" aria-label="Show the balance" style="position: absolute; top: 10px; right: 10px"><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-secondary)">account_balance_wallet</span></button>
<div class="seg" style="align-self: flex-start"><span class="on">Expenses</span><span>Income</span></div>
<div style="display: flex; align-items: center; gap: 20px">
<div style="position: relative; width: 136px; height: 136px; flex: none"><svg width="136" height="136" viewBox="0 0 136 136" aria-hidden="true">
<circle cx="68" cy="68" r="61" fill="none" stroke="#FFD166" stroke-width="14" pathLength="100" stroke-dasharray="33 100" stroke-dashoffset="0" transform="rotate(-90 68 68)"></circle>
<circle cx="68" cy="68" r="61" fill="none" stroke="#5DCAA5" stroke-width="14" pathLength="100" stroke-dasharray="21 100" stroke-dashoffset="-34" transform="rotate(-90 68 68)"></circle>
<circle cx="68" cy="68" r="61" fill="none" stroke="#FF9F6E" stroke-width="14" pathLength="100" stroke-dasharray="16 100" stroke-dashoffset="-56" transform="rotate(-90 68 68)"></circle>
<circle cx="68" cy="68" r="61" fill="none" stroke="#F5B544" stroke-width="14" pathLength="100" stroke-dasharray="12 100" stroke-dashoffset="-73" transform="rotate(-90 68 68)"></circle>
<circle cx="68" cy="68" r="61" fill="none" stroke="#8AB4F8" stroke-width="14" pathLength="100" stroke-dasharray="9 100" stroke-dashoffset="-86" transform="rotate(-90 68 68)"></circle>
<circle cx="68" cy="68" r="61" fill="none" stroke="#8A94A3" stroke-width="14" pathLength="100" stroke-dasharray="3 100" stroke-dashoffset="-96" transform="rotate(-90 68 68)"></circle>
</svg><div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span class="num" style="font-size: 15px; line-height: 20px">₼3,435.00</span><span class="cap muted">Spent</span></div></div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #FFD166"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Transport</span><span class="cap" style="color: var(--text-primary)">33%</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #5DCAA5"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Groceries</span><span class="cap" style="color: var(--text-primary)">22%</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #FF9F6E"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cafe &amp; Restaurants</span><span class="cap" style="color: var(--text-primary)">16%</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #F5B544"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Work</span><span class="cap" style="color: var(--text-primary)">13%</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #8AB4F8"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Car</span><span class="cap" style="color: var(--text-primary)">10%</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span class="dot" style="background: #8A94A3"></span><span class="cap" style="flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The rest</span><span class="cap" style="color: var(--text-primary)">6%</span></div>
</div></div></section></div>
<nav style="flex: none; height: 80px; background: var(--bg-surface); border-top: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; padding: 0 16px"><button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px"><span style="padding: 4px 16px; border-radius: 999px; background: var(--bg-surface-high);"><span class="ms fill" aria-hidden="true" style="font-size: 22px; color: var(--text-primary)">home</span></span><span style="font-size: 12px; font-weight: 600; color: var(--text-primary)">Home</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px"><span style="padding: 4px 16px; border-radius: 999px; "><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-muted)">receipt_long</span></span><span style="font-size: 12px; font-weight: 600; color: var(--text-muted)">History</span></button><a href="QuickAdd.dc.html" aria-label="Add transaction" style="width: 64px; height: 64px; border-radius: 22px; background: var(--accent-fill); display: flex; align-items: center; justify-content: center; margin-top: -28px; text-decoration: none"><span class="ms" aria-hidden="true" style="font-size: 32px; color: var(--accent-on)">add</span></a><button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px"><span style="padding: 4px 16px; border-radius: 999px; "><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-muted)">insights</span></span><span style="font-size: 12px; font-weight: 600; color: var(--text-muted)">Insights</span></button><button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px"><span style="padding: 4px 16px; border-radius: 999px; "><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-muted)">account_balance_wallet</span></span><span style="font-size: 12px; font-weight: 600; color: var(--text-muted)">Accounts</span></button></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>

</body>
</html>
