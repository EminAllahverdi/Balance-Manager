<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transfer between accounts</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Space+Grotesk:wght@500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.scr{font-family:Manrope,system-ui,sans-serif;background:var(--bg-canvas);color:var(--text-primary);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block;flex:none}
.fill{font-variation-settings:'FILL' 1}
.num{font-family:'Space Grotesk',Manrope,sans-serif;font-weight:500}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-secondary)}
.muted{color:var(--text-muted)}
.over{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--bg-surface-raised);border:1px solid var(--border-default);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.row{background:var(--bg-surface);border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--bg-surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-surface-raised)}
.seg>span{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-muted)}
.seg>span.on{background:var(--bg-surface-high);color:var(--text-primary)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--bg-surface-high);position:relative;flex:none}
.toggle>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text-muted)}
.toggle.on{background:var(--accent-fill)}
.toggle.on>i{left:21px;background:var(--accent-on)}
.sheet{background:var(--bg-surface);border-radius:28px 28px 0 0}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 0}
.scroll-x{display:flex;gap:8px;overflow:hidden}
.t-dark{--bg-canvas:#0B0D10;--bg-surface:#121519;--bg-surface-raised:#181C21;--bg-surface-high:#1F242B;--border-default:#1F242B;--border-strong:#2A3038;--text-primary:#F2F4F7;--text-secondary:#AEB6C1;--text-muted:#8A94A3;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#C8F169;--money-expense:#FF7A66;--money-income:#4ADE9B;--status-warning:#F5B544;--person-me:#5B9DFF;--person-wife:#FF7AB6;--person-daughter:#FFB547;--person-mom:#A78BFA;--person-family:#8A94A3;--scrim:rgba(0,0,0,0.62)}.t-light{--bg-canvas:#F7F8F5;--bg-surface:#FFFFFF;--bg-surface-raised:#F1F2EE;--bg-surface-high:#E3E6E1;--border-default:#E3E6E1;--border-strong:#AEB6C1;--text-primary:#0B0D10;--text-secondary:#5C6570;--text-muted:#5C6570;--accent-fill:#C8F169;--accent-on:#0B0D10;--accent-text:#4A7A00;--money-expense:#C2412D;--money-income:#11845B;--status-warning:#A86A00;--person-me:#2F6FD6;--person-wife:#C93D82;--person-daughter:#B87700;--person-mom:#7357D6;--person-family:#5F6873;--scrim:rgba(11,13,16,0.45)}</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px">

<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section class="sheet" aria-label="Transfer" style="position: absolute; left: 0; right: 0; bottom: 0; top: 36px; display: flex; flex-direction: column">
<div class="handle"></div>
<div style="padding: 14px 16px 0"><div class="seg" style="width: 100%; display: flex"><span style="flex: 1 1 0; text-align: center">Expense</span><span style="flex: 1 1 0; text-align: center">Income</span><span class="on" style="flex: 1 1 0; text-align: center">Transfer</span></div></div>
<div style="padding: 16px 16px 0; display: flex; align-items: center; gap: 8px; position: relative">
<div class="row" style="flex: 1 1 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-default); background: var(--bg-surface-raised)"><span class="over">From</span><span style="display: flex; align-items: center; gap: 10px"><span class="tile" style="width: 36px; height: 36px; background: rgba(93,202,165,0.16)"><span class="ms" aria-hidden="true" style="font-size: 20px; color: #5DCAA5">payments</span></span><span style="font-size: 15px; font-weight: 700">Salary</span></span><span class="cap num">₼1,846.20 → ₼984.59</span></div>
<span style="position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 20px; background: var(--bg-surface-high); border: 4px solid var(--bg-surface); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 20px; color: var(--text-primary)">arrow_forward</span></span>
<div class="row" style="flex: 1 1 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-default); background: var(--bg-surface-raised)"><span class="over">To</span><span style="display: flex; align-items: center; gap: 10px"><span class="tile" style="width: 36px; height: 36px; background: rgba(200,241,105,0.16)"><span class="ms" aria-hidden="true" style="font-size: 20px; color: #C8F169">credit_card</span></span><span style="font-size: 15px; font-weight: 700">Taksit</span></span><span class="cap num">₼2,431.75 → ₼4,106.85</span></div>
</div>
<div style="padding: 20px 20px 4px; display: flex; align-items: center; justify-content: space-between"><span class="num" style="font-size: 48px; line-height: 52px; letter-spacing: -2px">₼1,184.00</span></div>
<div style="padding: 0 20px" class="cap">Puts back what you spent from Taksit this month</div>
<div style="padding: 14px 16px 0" class="scroll-x"><button class="chip on">Pay off used ₼1,184</button><button class="chip">Half</button><button class="chip">All of Salary</button></div>
<div style="padding: 10px 16px 0; display: flex; gap: 8px"><button class="chip" style="background: var(--bg-surface-high)"><span class="ms" aria-hidden="true" style="font-size: 16px; color: var(--text-primary)">event</span>Today</button><label style="flex: 1 1 0; height: 36px; border-radius: 999px; background: var(--bg-surface-raised); border: 1px solid var(--border-default); display: flex; align-items: center; gap: 6px; padding: 0 12px"><span class="ms" aria-hidden="true" style="font-size: 16px; color: var(--text-muted)">notes</span><input aria-label="Note" value="Taksit payoff" style="flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--text-primary); font: 600 13px Manrope"></label></div>
<div style="margin-top: auto; padding: 12px 16px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="grid-column: span 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">1</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">2</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">3</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">4</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">5</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">6</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">7</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">8</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">9</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">.</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px">0</button><button style="height: 50px; border-radius: 14px; background: var(--bg-surface-raised); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px"><span class="ms" aria-hidden="true" style="font-size: 22px; color: var(--text-primary)">backspace</span></button></div>
<button style="border-radius: 14px; background: var(--accent-fill); color: var(--accent-on); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 15px"><span class="ms" aria-hidden="true" style="font-size: 28px; color: var(--accent-on)">swap_horiz</span>Move</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
